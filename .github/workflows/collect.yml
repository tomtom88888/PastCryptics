name: Collect daily puzzle

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      ids:
        description: "Optional space-separated puzzle ids to fetch"
        required: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch puzzles
        env:
          IDS: ${{ github.event.inputs.ids }}
        run: |
          if [ -n "$IDS" ]; then
            python scripts/collect.py --id $IDS
          else
            python scripts/collect.py
          fi
      - name: Commit new puzzles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add puzzles
          git diff --cached --quiet || (git commit -m "Archive puzzles $(date -u +%F)" && git push)
