name: Collect daily puzzle

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      ids:
        description: "Optional space-separated puzzle ids to fetch"
        required: false
      backfill:
        description: "Also backfill past puzzles from minutecryptic.today and tryhardguides.com"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch puzzles
        env:
          IDS: ${{ github.event.inputs.ids }}
          BACKFILL: ${{ github.event.inputs.backfill }}
        run: |
          if [ "$BACKFILL" = "true" ]; then
            python scripts/backfill.py today tryhard || echo "backfill finished with errors"
          fi
          if [ -n "$IDS" ]; then
            python scripts/collect.py --id $IDS
          else
            python scripts/collect.py
          fi
      - name: Commit new puzzles
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/collect.py --index-only
          git add puzzles
          git diff --cached --quiet || (git commit -m "Archive puzzles $(date -u +%F)" && git push)
